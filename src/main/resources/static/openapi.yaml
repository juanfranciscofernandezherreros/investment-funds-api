openapi: 3.1.0
info:
  title: Investment Funds API
  version: 1.0.0
paths:
  /api/v1/funds:
    get:
      tags: [Funds]
      operationId: searchFunds
      summary: Search investment funds
      parameters:
        - {$ref: '#/components/parameters/isin'}
        - {$ref: '#/components/parameters/name'}
        - {$ref: '#/components/parameters/managementCompany'}
        - {$ref: '#/components/parameters/category'}
        - {$ref: '#/components/parameters/currency'}
        - {$ref: '#/components/parameters/riskLevel'}
        - {$ref: '#/components/parameters/active'}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Paged funds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageFund'}
    post:
      tags: [Funds]
      operationId: createFund
      summary: Create an investment fund
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateFundRequest'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Fund'}}}}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/funds/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
    get:
      tags: [Funds]
      operationId: getFundById
      summary: Get an investment fund
      responses: {'200': {description: Fund, content: {application/json: {schema: {$ref: '#/components/schemas/Fund'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [Funds]
      operationId: patchFund
      summary: Partially update an investment fund
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchFundRequest'}}}}
      responses:
        '200':
          description: Updated fund
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Fund'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Funds]
      operationId: deleteFund
      summary: Physically delete an investment fund
      responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/NotFound'}}
components:
  parameters:
    isin: {name: isin, in: query, schema: {type: string, maxLength: 12}}
    name: {name: name, in: query, schema: {type: string, maxLength: 200}}
    managementCompany: {name: managementCompany, in: query, schema: {type: string, maxLength: 200}}
    category: {name: category, in: query, schema: {type: string, maxLength: 100}}
    currency: {name: currency, in: query, schema: {type: string, minLength: 3, maxLength: 3}}
    riskLevel: {name: riskLevel, in: query, schema: {type: integer, minimum: 1, maximum: 7}}
    active: {name: active, in: query, schema: {type: boolean}}
  responses:
    NotFound: {description: Fund not found}
    Conflict: {description: ISIN already exists}
  schemas:
    CreateFundRequest:
      type: object
      required: [isin, name, currency, active]
      properties: &fundProperties
        isin: {type: string, maxLength: 12}
        name: {type: string, maxLength: 200}
        managementCompany: {type: string, maxLength: 200}
        category: {type: string, maxLength: 100}
        currency: {type: string, minLength: 3, maxLength: 3}
        inceptionDate: {type: string, format: date}
        navDate: {type: string, format: date}
        nav: {type: number, format: decimal}
        assetsUnderManagement: {type: number, format: decimal}
        investors: {type: integer}
        managementFee: {type: number, format: decimal}
        depositFee: {type: number, format: decimal}
        ter: {type: number, format: decimal}
        riskLevel: {type: integer, minimum: 1, maximum: 7}
        returnYtd: {type: number, format: decimal}
        return1Year: {type: number, format: decimal}
        return3Years: {type: number, format: decimal}
        return5Years: {type: number, format: decimal}
        active: {type: boolean}
    PatchFundRequest:
      type: object
      properties: *fundProperties
    Fund:
      allOf: [{$ref: '#/components/schemas/CreateFundRequest'}]
      properties:
        id: {type: integer, format: int64, readOnly: true}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    PageFund:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Fund'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
